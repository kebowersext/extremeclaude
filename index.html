<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extreme Dashboard</title>

  <!-- AG-Grid Community CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      padding: 16px 24px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #e94560;
    }

    main {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .toolbar input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #0f3460;
      background: #16213e;
      color: #e0e0e0;
      font-size: 0.9rem;
      width: 260px;
    }

    .toolbar input::placeholder { color: #666; }

    #grid-container {
      flex: 1;
      min-height: 500px;
    }
  </style>
</head>
<body>

<header>
  <h1>Extreme Dashboard</h1>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search..." />
  </div>
  <div id="grid-container" class="ag-theme-alpine-dark"></div>
</main>

<!-- AG-Grid Community UMD bundle -->
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
<script src="app.js"></script>

</body>
</html>
